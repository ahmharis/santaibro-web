<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Checkout - Santai, Bro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .main-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-cs-image {
            width: 100px;
            height: auto;
            border-radius: 50%;
        }

        /* --- KODE UNTUK LOGO CS ANIMASI --- */
        @keyframes sway {
            0% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
            100% { transform: rotate(-5deg); }
        }

        .animated-logo {
            animation: sway 5s ease-in-out infinite;
            transform-origin: top center;
        }
        /* ---------------------------------- */

        .logo-text {
            color: #0d2a63;
            font-weight: bold;
            font-size: 1.2rem;
            margin-top: 5px;
        }

        .logo-subtext {
            color: #555;
            font-size: 0.9rem;
        }

        .checkout-title {
            color: #0d2a63;
            font-size: 1.8rem;
            font-weight: bold;
            margin-top: 20px;
            text-align: center;
        }

        .checkout-subtitle {
            color: #555;
            font-size: 1rem;
            margin-top: 5px;
            text-align: center;
        }

        .form-section {
            background-color: white;
            padding: 20px;
            border-radius: 15px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 20px;
        }

        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-number {
            background-color: #0d2a63;
            color: white;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            margin-right: 10px;
        }

        .section-title {
            color: #0d2a63;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .input-group {
            margin-bottom: 15px;
            width: 100%;
        }

        .input-label {
            color: #333;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        .input-field {
            width: calc(100% - 20px);
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
        }

        .select-field {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
            color: #555;
        }

        .bottom-nav {
            background-color: white;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid #ddd;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.05);
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        .nav-item {
            text-align: center;
            color: #888;
            text-decoration: none;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav-item.active {
            color: #0d2a63;
        }

        .nav-icon {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .nav-label {
            font-size: 0.9rem;
        }

        /* --- KODE UNTUK OPTIMASI DESKTOP --- */
        @media (min-width: 768px) {
            .main-container {
                flex-direction: row;
                align-items: flex-start;
                padding: 40px;
                max-width: 1200px;
                margin: 0 auto;
            }

            .logo-section {
                flex: 1;
                margin-right: 40px;
                text-align: left;
                margin-bottom: 0;
            }

            .checkout-title {
                text-align: left;
                margin-top: 0;
            }

            .checkout-subtitle {
                text-align: left;
            }

            .form-wrapper {
                flex: 2;
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                margin-top: 0;
            }

            .form-section {
                width: 100%;
                margin-top: 0;
                margin-bottom: 20px;
            }

            .bottom-nav {
                position: static;
                margin-top: 20px;
                border-top: none;
                width: 100%;
                justify-content: flex-start;
                padding: 20px 0 0 0;
                box-shadow: none;
            }

            .nav-item {
                flex: 0 0 auto;
                margin-right: 30px;
                align-items: flex-start;
            }
        }
        /* ---------------------------------- */

    </style>
</head>
<body>

    <div class="main-container">
        <div class="logo-section">
            <img src="path_ke_logo_cs_tongkat_gaya_lain.png" alt="Logo Santai, Bro (Gaya Lain)" class="logo-cs-image animated-logo">
            <div class="logo-text">Santai, Bro</div>
            <div class="logo-subtext">Sini, biar kami saja</div>
        </div>

        <div class="form-wrapper">
            <div class="checkout-title">Portal Checkout</div>
            <div class="checkout-subtitle">Sistem administrasi satset, bebas ribet.</div>

            <div class="form-section">
                <div class="section-header">
                    <div class="section-number">1</div>
                    <div class="section-title">IDENTITAS KLIEN</div>
                </div>
                <div class="input-group">
                    <label class="input-label">Nama Lengkap / Panggilan</label>
                    <input type="text" placeholder="Ketik nama panggilan Anda" class="input-field">
                </div>
                <div class="input-group">
                    <label class="input-label">WhatsApp</label>
                    <input type="text" placeholder="08..." class="input-field">
                </div>
                <div class="input-group">
                    <label class="input-label">Email Aktif</label>
                    <input type="text" placeholder="bro@email.com" class="input-field">
                </div>
            </div>

            <div class="form-section">
                <div class="section-header">
                    <div class="section-number">2</div>
                    <div class="section-title">DETAIL PROYEK</div>
                </div>
                <div class="input-group">
                    <label class="input-label">Kategori Layanan</label>
                    <select class="select-field">
                        <option>Pilih jenis layanan...</option>
                    </select>
                </div>
                <div class="input-group">
                    <label class="input-label">Detail Permintaan Tugas</label>
                    <input type="text" placeholder="..." class="input-field">
                </div>
            </div>
            
            <nav class="bottom-nav">
                <a href="#" class="nav-item active">
                    <span class="nav-icon">&#127962;</span>
                    <span class="nav-label">Pesan</span>
                </a>
                <a href="#" class="nav-item">
                    <span class="nav-icon">&#128172;</span>
                    <span class="nav-label">Support</span>
                </a>
                <a href="#" class="nav-item">
                    <span class="nav-icon">&#128230;</span>
                    <span class="nav-label">Radar</span>
                </a>
            </nav>
        </div>
    </div>

</body>
</html>
